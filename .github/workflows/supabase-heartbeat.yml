name: Supabase weekly ping
on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_URL-SUPABASE_URL }}/rest/v1/Category" \
            -H "apikey: ${{ secrets.SUPABASE_URL-SUPABASE_KEY }}"
